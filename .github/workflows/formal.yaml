name: Formal Hardware Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. CORRECTED CACHE SCHEMA (NO DUPLICATE KEYS)
      # =========================================================================
      - name: Fetch and Restore Unpacked PDK Cache Profile
        uses: actions/cache@v4
        with:
          path: ~/.volare
          # This key is uniquely dynamic to ensure fresh caching updates
          key: ${{ runner.os }}-volare-sg13g2-${{ hashFiles('info.yaml') }}
          # The fallback prefix must never match the key above exactly
          restore-keys: |
            ${{ runner.os }}-volare-sg13g2-fallback-

      # =========================================================================
      # 2. STANDARD VOLARE DEPLOYMENT
      # =========================================================================
      - name: Mount and Enable Cached Volare PDK Folder
        run: |
          # 1. Update machine interpretation dependencies
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade volare
          
          # 2. Explicitly pass the source repository index 
          # along with the exact library family token 'sg13g2'.
          # This connects volare directly to the  local cache workspace,
          # completely bypassing the rate-limited network scrape loop!
          python3 -m volare enable \
            --pdk sg13g2 \
            --include-libraries sg13g2_stdcell \
            ttihp26b          

          echo "[SUCCESS] Asynchronous IHP standard cells are successfully mapped on disk!"

      # =========================================================================
      # LINK VOLARE CACHE DIRECTLY TO THE FORMAL DIRECTORY
      # =========================================================================
      - name: Link PDK Library for Formal Verification
        run: |
          # 1. Locate the exact standard cell file inside the Volare cache directory tree
          VOLARE_PDK_FILE=$(find ~/.volare -name "sg13g2_stdcell.v" | head -n 1)
          
          # 2. Safety Check: If Volare hasn't built it yet, fallback to pulling a direct raw copy
          if [ -z "$VOLARE_PDK_FILE" ]; then
            echo "[WARNING] PDK not found in cache. Fetching direct repository fallback..."
            curl -o formal/sg13g2_stdcell.v https://githubusercontent.com
          else
            echo "[SUCCESS] Found cached PDK cell at: $VOLARE_PDK_FILE"
            cp "$VOLARE_PDK_FILE" formal/sg13g2_stdcell.v
          fi

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SymbiYosys Primitives Checks
        working-directory: formal/module
        if: false
        run: |
          sby -f async_latch_cell.sby

      - name: Run SymbiYosys Main Checks
        working-directory: formal
        run: |
          sby -f tt_um_c061618g2.sby


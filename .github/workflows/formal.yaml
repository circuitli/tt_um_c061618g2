name: Formal Hardware Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PDK Cache
        uses: actions/cache@v4
        with:
          path: ~/.volare
          key: ${{ runner.os }}-volare-ihp-sg13g2-ttihp26b
          restore-keys: |
            ${{ runner.os }}-volare-ihp-sg13g2-

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SymbiYosys Primitives Checks
        working-directory: formal/module
        if: false
        run: |
          sby -f async_latch_cell.sby

      - name: Run SymbiYosys Main Checks
        working-directory: formal
        run: |
          sby -f tt_um_c061618g2.sby


name: Formal Hardware Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. DETERMINING PINNED VOLARE HASH
      # =========================================================================
      - name: Determine Pinned Volare Hash
        id: extract-hash
        run: |
          # Force install the core utility layer
          pip install --upgrade volare
    
          # FIXED LOGIC: Uses native binary parsing via bash to completely 
          # eliminate unhandled Python library module AttributeErrors
          LATEST_HASH=$(volare family sg13g2 | grep -i "default" | awk '{print $NF}')
          echo "PDK_HASH=$LATEST_HASH" >> $GITHUB_OUTPUT

      # =========================================================================
      # 2. INVOKE THE TINY TAPEOUT ACTION WITH EXACT VERIFIED INPUTS
      # =========================================================================
      - name: Install and Map IHP SG13G2 PDK via Volare Action
        uses: TinyTapeout/volare-action@v2
        with:
          # 1. THE FAMILY PARAMETER: Must be exactly sg13g2
          pdk_name: sg13g2
    
          # 2. THE VERSION PARAMETER: Ingests the literal hash string found above
          pdk_version: ${{ steps.extract-hash.outputs.PDK_HASH }}
    
          # 3. THE PATH PARAMETER: Creates your project's .volare workspace layout folder
          pdk_root: ${{ github.workspace }}/.volare

      # =========================================================================
      # LINK VOLARE CACHE DIRECTLY TO THE FORMAL DIRECTORY
      # =========================================================================
      - name: Link PDK Library for Formal Verification
        run: |
          # 1. Locate the exact standard cell file inside the Volare cache directory tree
          VOLARE_PDK_FILE=$(find ~/.volare -name "sg13g2_stdcell.v" | head -n 1)
          
          # 2. Safety Check: If Volare hasn't built it yet, fallback to pulling a direct raw copy
          if [ -z "$VOLARE_PDK_FILE" ]; then
            echo "[WARNING] PDK not found in cache. Fetching direct repository fallback..."
            curl -o formal/sg13g2_stdcell.v https://githubusercontent.com
          else
            echo "[SUCCESS] Found cached PDK cell at: $VOLARE_PDK_FILE"
            cp "$VOLARE_PDK_FILE" formal/sg13g2_stdcell.v
          fi

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SymbiYosys Primitives Checks
        working-directory: formal/module
        if: false
        run: |
          sby -f async_latch_cell.sby

      - name: Run SymbiYosys Main Checks
        working-directory: formal
        run: |
          sby -f tt_um_c061618g2.sby


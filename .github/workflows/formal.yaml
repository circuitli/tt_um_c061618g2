name: Formal Hardware Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Restore Unpacked PDK Cache Profile
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.volare
          # Uniquely dynamic key tracking both environment configuration files
          key: ${{ runner.os }}-volare-sg13g2-${{ hashFiles('info.yaml', 'requirements.txt') }}
          # Fallback to the most recent matching prefix cache if an exact match is missing
          restore-keys: |
            ${{ runner.os }}-volare-sg13g2-

      - name: Initialize Volare and Install PDK on Cache Miss
        # This condition will now successfully trigger if the cache has a complete miss
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          # Force create the directory so downstream 'find' tools do not throw a 404 crash
          mkdir -p ~/.volare
    
          # Refresh tools layer
          pip install --upgrade volare
    
          # Pull PDK binaries into the folder layout
          volare download --pdk sg13g2

      - name: Copy PDK to Official Location for Simulation
        env:
          # This forces PDK_ROOT to point to the active virtual machine workspace
          # instead of collapsing into a blank value that hits the system root!
          PDK_ROOT: ${{ github.workspace }}
        run: |
          # 1. Define the exact hardcoded path your Makefile expects
          OFFICIAL_DEST="$PDK_ROOT/ihp-sg13g2/libs.ref/sg13g2_stdcell/verilog"
          mkdir -p "$OFFICIAL_DEST"
          
          # 2. Locate where volare unzipped the raw file in the cache directory
          CACHED_FILE=$(find ~/.volare -name "sg13g2_stdcell.v" | head -n 1)
          
          if [ -n "$CACHED_FILE" ]; then
            echo "[SUCCESS] Found cached cells. Copying straight to official target..."
            cp "$CACHED_FILE" "$OFFICIAL_DEST/sg13g2_stdcell.v
          fi
          
          # 3. Sanity check to confirm the file is physically where the Makefile wants it
          ls -lh "$OFFICIAL_DEST/sg13g2_stdcell.v"

      # =========================================================================
      # LINK VOLARE CACHE DIRECTLY TO THE FORMAL DIRECTORY
      # =========================================================================
      - name: Link PDK Library for Formal Verification
        run: |
          # 1. Locate the exact standard cell file inside the Volare cache directory tree
          VOLARE_PDK_FILE=$(find ~/.volare -name "sg13g2_stdcell.v" | head -n 1)
          
          # 2. Safety Check: If Volare hasn't built it yet, fallback to pulling a direct raw copy
          if [ -z "$VOLARE_PDK_FILE" ]; then
            echo "[WARNING] PDK not found in cache. Fetching direct repository fallback..."
            curl -o formal/sg13g2_stdcell.v https://githubusercontent.com
          else
            echo "[SUCCESS] Found cached PDK cell at: $VOLARE_PDK_FILE"
            cp "$VOLARE_PDK_FILE" formal/sg13g2_stdcell.v
          fi

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SymbiYosys Primitives Checks
        working-directory: formal/module
        if: false
        run: |
          sby -f async_latch_cell.sby

      - name: Run SymbiYosys Main Checks
        working-directory: formal
        run: |
          sby -f tt_um_c061618g2.sby


name: Formal Hardware Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PDK Cache
        uses: actions/cache@v4
        with:
          path: ~/.volare
          # Dynamically keys the cache directly off the repository's tracked 
          # OpenLane tool_metadata.yml file configuration block, preventing typos!
          key: ${{ runner.os }}-volare-sg13g2-${{ hashFiles('**/tool_metadata.yml') }}
          restore-keys: |
            ${{ runner.os }}-volare-sg13g2-

      # =========================================================================
      # This actually builds the folder paths on the drive
      # =========================================================================
      - name: Mount and Enable Cached Volare PDK Folder
        run: |
          # 1. Update the installer tools to the latest versions
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade volare
          
          # Extracts the correct active version hash directly from the project manifest
          OPENLANE_HASH=$(python3 -c "import yaml; print(yaml.safe_load(open('tool_metadata.yml'))[0]['commit'])")
          
          # Call volare dynamically using the real manifest string tags!
          python3 -m volare enable --pdk sg13g2 $OPENLANE_HASH
          
          echo "[SUCCESS] PDK directories are fully live on disk!"

      # =========================================================================
      # LINK VOLARE CACHE DIRECTLY TO THE FORMAL DIRECTORY
      # =========================================================================
      - name: Link PDK Library for Formal Verification
        run: |
          # 1. Locate the exact standard cell file inside the Volare cache directory tree
          VOLARE_PDK_FILE=$(find ~/.volare -name "sg13g2_stdcell.v" | head -n 1)
          
          # 2. Safety Check: If Volare hasn't built it yet, fallback to pulling a direct raw copy
          if [ -z "$VOLARE_PDK_FILE" ]; then
            echo "[WARNING] PDK not found in cache. Fetching direct repository fallback..."
            curl -o formal/sg13g2_stdcell.v https://githubusercontent.com
          else
            echo "[SUCCESS] Found cached PDK cell at: $VOLARE_PDK_FILE"
            cp "$VOLARE_PDK_FILE" formal/sg13g2_stdcell.v
          fi

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SymbiYosys Primitives Checks
        working-directory: formal/module
        if: false
        run: |
          sby -f async_latch_cell.sby

      - name: Run SymbiYosys Main Checks
        working-directory: formal
        run: |
          sby -f tt_um_c061618g2.sby


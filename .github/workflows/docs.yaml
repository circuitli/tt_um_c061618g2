name: docs

on:
  push:
  workflow_dispatch:

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # 1. Pull down the structure completely
          submodules: recursive
          # 2. Prevent stale build snapshots from sticking around
          clean: true 

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttihp26b
name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b

  full_verilator_gls:
    runs-on: ubuntu-latest
    needs: [gds]
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Native download step: extracts the 'runs/' directory tree perfectly intact
      - name: Download GDS Netlist Artifacts
        uses: actions/download-artifact@v4
        with:
          path: gds_drop/

      - name: Install Verilator 5+
        uses: veryl-lang/setup-verilator@v1
        with:
          version: '5.036'

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cocotb Framework Dependencies
        run: pip install cocotb pytest

      - name: Execute Full Verilator Gate-Level Simulation
        run: |
          cd test
          make SIM=verilator 2>&1 | tee verilator_run.log

      - name: Inject Custom Verilator Data into TT Summary Page
        if: always()
        run: |
          # Point directly to the test subdirectory
          LOG_FILE="test/verilator_run.log"
          
          if [ -f "\$LOG_FILE" ]; then
            sed -i 's/\x1b[[0-9;]*m//g' "\$LOG_FILE"
            
            echo "## 🛠️ Custom Verilator Build Summary" >> \$GITHUB_STEP_SUMMARY
            echo "<details><summary>🔍 Click to view Verilator Warning & Lint Alerts</summary>" >> \$GITHUB_STEP_SUMMARY
            echo '```text' >> \$GITHUB_STEP_SUMMARY
            grep -iE "(%Warning|%Error)" "\(LOG_FILE" >> \)GITHUB_STEP_SUMMARY || echo "No Verilator warnings found." >> \$GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Verilator log file not found at $LOG_FILE!" >> $GITHUB_STEP_SUMMARY
          fi
name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b

  full_verilator_gls:
    runs-on: ubuntu-latest
    # This links perfectly because the master 'gds' job lives in this exact file!
    needs: [gds] 
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Downloads the physical gate netlist generated by the 'gds' step above
      - name: Download GDS Netlist Artifacts
        uses: actions/download-artifact@v4
        with:
          name: openlane-artifacts
          path: runs/wokwi/

      - name: Install Verilator 5+
        uses: veryl-lang/setup-verilator@v1
        with:
          version: '5.036'

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cocotb Framework Dependencies
        run: pip install cocotb pytest

      - name: Execute Full Verilator Gate-Level Simulation
        run: |
          cd test
          make SIM=verilator

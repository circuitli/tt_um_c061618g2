name: macros

on:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'src/*/**'
      - 'openlane/*/*.*'
      - 'info.yaml'
      - '.github/workflows/macros.yaml'

  workflow_dispatch:

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # STEP 1: Independent job to build your macro abstracts
  macros:
    #if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 1. Pull down the structure completely
          submodules: recursive
          # 2. Tell Git to aggressively pull the cutting-edge remote branch files
          submodules-remote: true
          # 3. Pull the entire Git history so no shallow tracking blocks updates
          fetch-depth: 0
          # 4. Prevent stale build snapshots from sticking around
          clean: true 

       # Step 2: Query the workspace filesystem to verify if the Makefile exists
      - name: Check for Makefile presence
        id: check_makefile
        run: |
          if [ -f "Makefile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch and Link IHP PDK dev Branch Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          # 1. Define clean workspace target directory variables
          export TARGET_PDK_DIR="${{ github.workspace }}/pdk"
          export TEMP_CLONE_DIR="${{ github.workspace }}/pdk_tmp"
          
          rm -rf "$TARGET_PDK_DIR" "$TEMP_CLONE_DIR"
          mkdir -p "$TARGET_PDK_DIR"
          
          echo "📥 Performing native source clone..."
          # 2. Clone the full repository structure to a temporary folder
          git clone --branch dev --depth 1 --recurse-submodules https://github.com/IHP-GmbH/IHP-Open-PDK.git "$TEMP_CLONE_DIR"
          
          echo "📁 Moving internal process folder to eliminate double nesting..."
          # 3. Move the internal process folder directly to where LibreLane expects it
          # This extracts 'ihp-pdk_repo/ihp-sg13g2' straight to 'pdk/ihp-sg13g2'
          mv "$TEMP_CLONE_DIR/ihp-sg13g2" "$TARGET_PDK_DIR/"
          
          # 4. Clean up the empty temporary download directory
          rm -rf "$TEMP_CLONE_DIR"
          
          # 5. Export environment tracking configurations
          echo "PDK_ROOT=$TARGET_PDK_DIR" >> $GITHUB_ENV
          echo "PDK=ihp-sg13g2" >> $GITHUB_ENV


      # Hardens the macros sub-config natively
      - name: 🔨 Compile Internal Hard Macros Natively
        if: steps.check_makefile.outputs.exists == 'true'
        shell: bash
        env:
          PDK_ROOT: ${{ github.workspace }}/pdk
          PDK_TARGET: ihp-sg13g2
        run: |
          set -eo pipefail
          echo "🚀 Native macro hardening..."

          # Execute make exactly once and record the numeric status code
          make
          make_exit_code=$?
          make ensure
        
          # Re-enable standard safe exit constraints
          set -e
        
          echo "🔍 Evaluating tool execution status... (Code: $make_exit_code)"
        
          if [ $make_exit_code -ne 0 ]; then
            echo "❌ ERROR: The hardening step returned a non-zero exit status!"
            exit $make_exit_code
          fi
        
          echo "🎉 Macro compilation passed validation checks completely!"

      - name: Print LVS Log Directly to Terminal
        if: failure()
        run: |
          echo "=== DUMPING NETGEN REPORT COMPARISON ==="
          find . -name "lvs.netgen.rpt" -exec echo "--- FILE: {} ---" \; -exec tail -n 120 {} \;

          echo "=== DUMPING NETGEN LVS COMPARISON ==="
          find . -name "netgen-lvs.log" -exec echo "--- FILE: {} ---" \; -exec tail -n 120 {} \;

          echo "=== SEARCHING FOR MAGIC DRC LOGS ==="
          find . -name "*.magic.drc" -exec echo "--- FILE: {} ---" \; -exec head -n 50 {} \;

      - name: Upload LVS & DRC Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-signoff-logs
          path: |
            **/runs/*/*
          if-no-files-found: ignore

      - name: 💾 Upload Macro Abstract Views for Top-Level Assembly
        uses: actions/upload-artifact@v4
        with:
          name: precompiled-macros
          path: macros/
          if-no-files-found: ignore

name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests with dynamic PDK patching
        run: |
          cd test
          make clean
          
          # Pass 1: Run make once to force the toolchain or environment setup scripts
          # to dynamically download/extract the PDK into the runner workspace.
          make || true
          
          # Target the absolute path where Icarus Verilog reported the compilation failure
          TARGET_PDK="/home/runner/pdk/ihp-sg13g2/libs.ref/sg13g2_stdcell/verilog/sg13g2_stdcell.v"
          
          if [ -f "$TARGET_PDK" ]; then
            echo "PDK file detected. Unlocking and removing unsupported ifnone tokens..."
            sudo chmod 777 "$TARGET_PDK" || true
            # Delete any lines containing the unsupported 'ifnone' syntax to prevent parser crashes
            sudo sed -i '/ifnone/d' "$TARGET_PDK" || true
          else
            echo "PDK file not found at the primary path, executing global directory sweep..."
            sudo find /home/runner/ -name "sg13g2_stdcell.v" -exec sed -i '/ifnone/d' {} + || true
          fi
          
          # Pass 2: Clear old partial compilation states and run the simulation for real
          make clean
          make
          
          # Safe return code validation without shell history expansion side-effects
          grep -q failure results.xml && exit 1 || exit 0

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
          if-no-files-found: ignore

name: test

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'info.yaml'
      - '.github/workflows/test.yaml'

  workflow_run:
    workflows: ["macros"]
    types:
      - completed

  workflow_dispatch:

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive  
          
      # 🔍 1. EXTRACT RUN ID (Handles manual buttons natively)
      - name: Resolve Macro Run ID
        id: resolve-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          else
            # Finds the absolute latest successful macros workflow run ID natively via GitHub CLI
            LATEST_ID=$(gh run list --workflow="macros.yaml" --status=success --limit=1 --json databaseId -q '.[0].databaseId')
            echo "run_id=$LATEST_ID" >> $GITHUB_OUTPUT
          fi

        # 📦 2. SAFE GITHUB ARTIFACT DOWNLOADER (Bypasses v4 run-id 404 bugs)
      - name: Download Precompiled Macro Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.resolve-id.outputs.run_id }}
        run: |
          echo "Checking for macro artifacts in run: $RUN_ID..."
          
          # Attempt to download the artifact via GitHub CLI; suppress 404 failure code
          if gh run download "$RUN_ID" --name precompiled-macros --dir macros/ 2>/dev/null; then
            echo "Successfully loaded precompiled macros."
          else
            echo "No macros directory found."
            exit -1
            #echo "No precompiled macros found or run doesn't exist yet. Creating empty layout placeholder."
            # Touch a dummy file so the build flow downstream doesn't stall on a completely empty folder
            #touch macros/.placeholder
          fi

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt
  
      - name: Install and Run PDK Downloader Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Install ciel (the open-source IHP PDK version manager)
          python3 -m pip install ciel
          
          # 2. Automatically retrieve the latest available version hash from IHP-Open-PDK
          # This extracts the latest commit tracking string dynamically
          LATEST_HASH=$(python3 -m ciel ls-remote --pdk-family ihp-sg13g2 | head -n 1 | awk '{print $1}')
          echo "Activating IHP PDK Version Hash: $LATEST_HASH"
          
          # 3. Instruct ciel to pull down and enable the target build using that hash
          python3 -m ciel enable --pdk-family ihp-sg13g2 "$LATEST_HASH"
          
          # 4. Create the flat path layout required by your simulations
          mkdir -p /home/runner/pdk
          
          # 5. Locate where ciel placed the versioned directory assets and symlink it
          CIEL_DIR=$(find /home/runner/ -type d -name "ihp-sg13g2" -path "*/versions/*" | head -n 1)
          ln -s "$CIEL_DIR" /home/runner/pdk/ihp-sg13g2
          
          # 6. Export environment variables to expose paths to subsequent tools
          echo "PDK_ROOT=/home/runner/pdk" >> $GITHUB_ENV
          echo "PDK=ihp-sg13g2" >> $GITHUB_ENV

      - name: Run tests
        run: |
          # Explicitly force the path back to the actual system PDK install location
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests with robust PDK patch
        run: |
          cd test
          # =========================================================================
          # TWO-PASS SIMULATION AND ROBUST SYMLINK-AWARE PDK PATCH
          # =========================================================================
          # Pass 1: Run make to force the toolchain to fetch/populate the PDK workspace directories
          make || true
          
          # Pass 2: Dynamically trace every instance of the PDK cell library, unlock permissions, and strip 'ifnone' lines
          # Added '--follow-symlinks' to ensure the real files are modified even if they are symlinked by a cache mount.
          if [ -d /home/runner/pdk ]; then
            sudo chmod -R +w /home/runner/pdk
            find /home/runner/pdk -name "sg13g2_stdcell.v" -exec sudo sed -i --follow-symlinks '/ifnone/d' {} +
          fi
          # =========================================================================
          
          # Pass 3: Clean previous partial outputs and execute the true validation suite run
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          grep -q failure results.xml && exit 1 || exit 0


      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
          if-no-files-found: ignore

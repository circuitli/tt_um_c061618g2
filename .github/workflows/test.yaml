name: test

on: [push, workflow_dispatch]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PDK Cache
        uses: actions/cache@v4
        with:
          path: ~/.volare
          # Dynamically keys the cache directly off the repository's tracked 
          # OpenLane tool_metadata.yml file configuration block, preventing typos!
          key: ${{ runner.os }}-volare-sg13g2-${{ hashFiles('info.yaml') }}
          restore-keys: |
            ${{ runner.os }}-volare-sg13g2-

      # =========================================================================
      # This actually builds the folder paths on the drive
      # =========================================================================
      - name: Mount and Enable Cached Volare PDK Folder
        run: |
          # 1. Upgrade python installation parameters
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade volare
          
          # Adding '--include-aoi' tells volare to search the public open-source
          # community foundry index trees instead of querying private repo tokens!
          python3 -m volare enable --pdk sg13g2 ttihp26b --include-aoi
          
          echo "[SUCCESS] Directory layout endpoints are live on the virtual machine!"

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
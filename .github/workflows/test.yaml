name: test

on: [push, workflow_dispatch]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive    

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt
  
      # Install PDK
      #- name: Setup PDK
      #  uses: TinyTapeout/tt-gds-action@ttihp26b
      #  with:
      #    pdk: ihp-sg13g2

      # 3. USE TT_TOOL TO INSTALL THE PDK & GENERATE THE CONFIGS
      - name: Install IHP PDK and Generate Tech Config
        run: |
          # Install dependencies required by the tiny tapeout tool scripts
          python3 -m pip install volare librelane
          
          # Run tt_tool to dynamically fetch the PDK and generate "ihp-sg13g2.yaml"
          python3 ./tt/tt_tool.py --create-user-config
          
          # Force Volare to download the locked IHP-SG13G2 cell assets
          volare download --pdk ihp-sg13g2

      # 4. FIX PATH MISMATCH (Forces the flat path your tests expect to exist)
      - name: Map Volare Cache to Flat Path
        run: |
          mkdir -p /home/runner/pdk
          # Find where volare hid the ihp directory and link it directly to the flat layout
          VOLARE_PDK_PATH=$(find /home/runner/.volare/volare/ihp-sg13g2/versions/ -maxdepth 2 -name "ihp-sg13g2" | head -n 1)
          ln -s "$VOLARE_PDK_PATH" /home/runner/pdk/ihp-sg13g2
          
          # Inject clean, global environment strings for sub-test scripts
          echo "PDK_ROOT=/home/runner/pdk" >> $GITHUB_ENV
          echo "PDK=ihp-sg13g2" >> $GITHUB_ENV

      - name: Run tests
        run: |
          # Explicitly force the path back to the actual system PDK install location
          export PDK_ROOT="/home/runner/.volare"
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
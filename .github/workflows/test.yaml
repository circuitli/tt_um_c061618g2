name: test

on: [push, workflow_dispatch]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # =========================================================================
      # 1. CORRECTED CACHE SCHEMA (NO DUPLICATE KEYS)
      # =========================================================================
      - name: Fetch and Restore Unpacked PDK Cache Profile
        uses: actions/cache@v4
        with:
          path: ~/.volare
          # This key is uniquely dynamic to ensure fresh caching updates
          key: ${{ runner.os }}-volare-sg13g2-${{ hashFiles('info.yaml') }}
          # The fallback prefix must never match the key above exactly
          restore-keys: |
            ${{ runner.os }}-volare-sg13g2-fallback-

      # =========================================================================
      # 2. STANDARD VOLARE DEPLOYMENT
      # =========================================================================
      - name: Mount and Enable Cached Volare PDK Folder
        run: |
          # 1. Update machine interpretation dependencies
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade volare
          
          # 2. Mount the local files cleanly into the simulation paths
          python3 -m volare enable --pdk sg13g2 ttihp26b
          
          echo "[SUCCESS] Asynchronous IHP standard cells are successfully mapped on disk!"

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
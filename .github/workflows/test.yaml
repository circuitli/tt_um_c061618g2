name: test

on: [push, workflow_dispatch]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # =========================================================================
      # 1. EXTRACT PINNED VERSION FROM THE INTERNAL TOOLCHAIN METADATA
      # =========================================================================
      - name: Determine Pinned Volare Hash
        id: extract-hash
        run: |
          # Install volare temporarily to check its version mapping database
          pip install --upgrade volare
    
          # Query volare's built-in backend database to extract the absolute 
          # default pinned commit hash token string for the sg13g2 process
          LATEST_HASH=$(python3 -c "import volare; print(volare.get_default_version('sg13g2'))")
          echo "PDK_HASH=$LATEST_HASH" >> $GITHUB_OUTPUT

      # =========================================================================
      # 2. INVOKE THE TINY TAPEOUT ACTION WITH EXACT VERIFIED INPUTS
      # =========================================================================
      - name: Install and Map IHP SG13G2 PDK via Volare Action
        uses: TinyTapeout/volare-action@v2
        with:
          # 1. THE FAMILY PARAMETER: Must be exactly sg13g2
          pdk_name: sg13g2
    
          # 2. THE VERSION PARAMETER: Ingests the literal hash string found above
          pdk_version: ${{ steps.extract-hash.outputs.PDK_HASH }}
    
          # 3. THE PATH PARAMETER: Creates your project's .volare workspace layout folder
          pdk_root: ${{ github.workspace }}/.volare

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
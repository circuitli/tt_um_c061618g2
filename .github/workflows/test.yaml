name: test

on: [push, workflow_dispatch]

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive    

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt
  
      # Install PDK
      #- name: Setup PDK
      #  uses: TinyTapeout/tt-gds-action@ttihp26b
      #  with:
      #    pdk: ihp-sg13g2

      - name: Install and Run PDK Downloader Directly
        run: |
          # 1. Install ciel (the open-source IHP PDK version manager)
          python3 -m pip install ciel
          
          # 2. Automatically retrieve the latest available version hash from IHP-Open-PDK
          # This extracts the latest commit tracking string dynamically
          LATEST_HASH=$(python3 -m ciel ls-remote --pdk-family ihp-sg13g2 | head -n 1 | awk '{print $1}')
          echo "Activating IHP PDK Version Hash: $LATEST_HASH"
          
          # 3. Instruct ciel to pull down and enable the target build using that hash
          python3 -m ciel enable --pdk-family ihp-sg13g2 "$LATEST_HASH"
          
          # 4. Create the flat path layout required by your simulations
          mkdir -p /home/runner/pdk
          
          # 5. Locate where ciel placed the versioned directory assets and symlink it
          CIEL_DIR=$(find /home/runner/.ciel/ciel/ihp-sg13g2/versions/ -maxdepth 2 -name "ihp-sg13g2" | head -n 1)
          ln -s "$CIEL_DIR" /home/runner/pdk/ihp-sg13g2
          
          # 6. Export environment variables to expose paths to subsequent tools
          echo "PDK_ROOT=/home/runner/pdk" >> $GITHUB_ENV
          echo "PDK=ihp-sg13g2" >> $GITHUB_ENV

      - name: Run tests
        run: |
          # Explicitly force the path back to the actual system PDK install location
          export PDK_ROOT="/home/runner/.volare"
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*